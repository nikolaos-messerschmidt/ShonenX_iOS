name: iOS unsigned build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Init submodules
        run: |
          git submodule update --init --recursive packages/anymex_extension_bridge
          git submodule update --init --recursive packages/commentum_client

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Create env file
        run: |
          cat > keys.json <<EOF
          {
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANILIST_CLIENT_SECRET": "${{ secrets.ANILIST_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}",
            "RELEASE_REPO": "nikolaos-messerschmidt/ShonenX_iOS"
          }
          EOF

      - name: Get Dependencies
        run: find . -name "pubspec.lock" -type f -delete && flutter pub upgrade

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign --dart-define-from-file=keys.json

      - name: Package as .ipa
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r ../../../shonenx-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: shonenx-ios-unsigned
          path: shonenx-unsigned.ipa
          retention-days: 14

      - name: Push to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-unsigned-${{ github.run_number }}
          name: iOS unsigned build #${{ github.run_number }}
          files: shonenx-unsigned.ipa
          prerelease: true
